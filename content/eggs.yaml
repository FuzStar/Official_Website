# 站点彩蛋。给愿意乱点、乱按、翻源码的人准备的小东西，不用在任何地方宣传。
#
# 每个彩蛋的 text 清空，就等于把它关掉——页面对应的动作不再有任何反应。
# 想彻底删掉某条，连带下面代码里的那几行一起删即可，内容是内容，触发方式在代码里。
#
# 写法：多行文字用 |-，单行直接写在冒号后面。

# 依次按 ↑ ↑ ↓ ↓ ← → ← → B A，屏幕上落一阵星星
konami:
  text: 你还记得这串方向键。

# 在键盘上连着敲 fuzz（在输入框里打字不算）
typing:
  keys: fuzz
  text: 敲出来了。爪子按到这里了。

# 在网址后面加 ?paw=1，全站光标换成爪印。
# 想去掉：把 ?paw=1 删掉重新打开，或者从站内点链接跳到别的页面。
paw:
  text: 光标换成爪子了。想变回去，把地址栏的 ?paw=1 删掉。

# 凌晨 0 点到 5 点之间打开任意页面，页脚会多一句
night:
  text: 这个点还没睡。

# 在页脚版权那行连点年份 5 下
year:
  text: 这一行是留给手痒的人的。

# 在"这一页走丢了"那个页面上，连点中间那颗星星 5 下
lost:
  text: 它没走丢，是你一直戳它。

# 打开浏览器控制台（F12）能看到的一段话，按行写
console: |-
  星绒社区 FuzzStar，非官方的福瑞同好组织。
  能翻到这里，多半是同类。
  开发部、社区部正在招人，去「加入我们」页看看。

# 藏在页面源码里的注释，右键"查看网页源代码"才看得到
comment: 翻到这里了。要不要来开发部一起写？
