# 站点全局信息。
# 页面上的域名、邮箱、群链接、岗位全部从这份文件读，改完这里全站跟着变。
# 引号里是空的就代表还没填：页面要么整块不显示，要么显示一句友好的空状态，
# 不会替你编内容，也不会把文件路径这类内部信息露给访客。

# 组织本体
org:
  name: FuzzStar # 英文名，用在字标和搜索引擎标题里
  nameZh: 星绒社区 # 中文名
  badge: 非官方兽圈社区 # 首页标题上方那个小标签，留空就不显示
  tagline: 把散在各处的同好，聚到一处。
  intro: 星绒社区（FuzzStar）是一个非官方的福瑞同好组织。现在主要聚在 QQ 群、QQ 频道和 Discord；线下聚会与社区 APP 都在筹备中。

# 站点地址与对外联系方式
url: https://fuzstar.org
email: max@fuzstar.org # 对外联系邮箱

# ICP 备案号，拿到之后填这里，填了页脚才会显示备案信息
icp: ""
icpUrl: https://beian.miit.gov.cn

# 社区群。首页和"加入我们"页都从这里渲染，顺序就是页面上的顺序
groups:
  - platform: qq # qq / qqchannel / discord / telegram，决定卡片上显示哪个图标
    name: FuzzStar
    handle: "120371716" # QQ 群号，填了会做成"点击复制"
    url: https://qm.qq.com/q/bbhpq1IXu
    note: 国内首选添加，人员多
  - platform: qqchannel
    name: 星绒社区Official
    handle: "pd10171931" # 频道号，填了会做成"点击复制"
    url: https://pd.qq.com/s/guxzvqx9i
    note: 官方 QQ 频道，可发帖
  - platform: discord
    name: FuzzStar
    handle: "" # Discord 没有群号就留空，复制按钮会自动隐藏
    url: https://discord.gg/GAAKPFD9K
    note: 习惯使用 Discord 可添加

# 招募说明，"加入我们"页岗位列表上方显示。留空就不显示
# 用 |- 写多行：中间的换行会原样保留，页面上按你写的断行显示
recruitNote: |-
  社区在往前走，人手一直不够。这次开放开发部、社区部两个方向。

  两个方向都要满足：
  年龄：15+
  具备团队协作能力及沟通能力
  会使用效率工具（飞书、WPS）
  能够听懂人话
  能够持续学习新的技能

  不要求全职，也不要求相关经验。想来的话发邮件到下面的地址，说明想去哪个方向、大概能投入多少时间。

# 招人的岗位，"加入我们"页的团队部分按这个列表渲染。
# 加岗位就复制一段改；slots 留空则不显示右上角的人数徽章。
# duty / requirement 用 |- 写多行，中间换行原样保留。
roles:
  - title: 开发部
    slots: "" # 招几个人，留空就不显示徽章
    duty: 社区 APP 的开发，以及官网的日常维护和迭代。
    requirement: |-
      后端方向
      至少懂得任意一门后端语言；任意一种数据库的使用；服务器部署、日志、监控、基本安全常识；能设计业务逻辑及接口；能写清晰的开发文档。

      前端方向
      至少懂得任意一门前端框架，熟悉前端技术栈；可独立完成页面开发、组件拆分、状态管理、接口联调；了解前端工程化；能够解决常见的问题。

      前后端会一侧即可。

      允许 vibe coding，但纯 vibe 且看不懂代码者请勿加入。
      必须持有一个 GitHub 账户，并熟练使用 Git CLI。
      组织部分源码需高度保密，严禁泄露给其他人员。

  - title: 社区部
    slots: ""
    duty: QQ 群、QQ 频道和 Discord 的日常管理，公告发布，以及线下聚会的筹备。
    requirement: |-
      必须懂得圈内文化及礼仪。

      成员暂不进行分组，故暂不提出过多要求。

# "友链与合作"页底部的合作说明，待填
collaboration: ""
