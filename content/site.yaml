# 站点全局信息。
# 页面上的域名、邮箱、群链接、岗位全部从这份文件读，改完这里全站跟着变。
# 引号里是空的就代表还没填：页面要么整块不显示，要么显示一句友好的空状态，
# 不会替你编内容，也不会把文件路径这类内部信息露给访客。
#
# recruitNote、roles[].duty、roles[].requirement、collaboration 这几个字段按 markdown 写，
# 能用小标题（#### 标题）、列表（- 一项）、加粗（**字**），构建时渲染成页面排版。
# 其余字段是纯文本，写什么显示什么。

# 组织本体
org:
  name: FuzzStar # 英文名，用在字标和搜索引擎标题里
  nameZh: 星绒社区 # 中文名
  badge: 非官方兽圈社区 # 首页标题上方那个小标签，留空就不显示
  tagline: 把散在各处的同好，聚到一处。
  intro: 星绒社区（FuzzStar）是一个非官方的福瑞同好组织。现在主要聚在 QQ 群、QQ 频道和 Discord；线下聚会与社区 APP 都在筹备中。

# 站点地址与对外联系方式
url: https://fuzstar.org
email: max@fuzstar.org # 对外联系邮箱

# ICP 备案号，拿到之后填这里，填了页脚才会显示备案信息
icp: ""
icpUrl: https://beian.miit.gov.cn

# "加入我们"页开头那句。这页底下有两条路（进社群、进工作团队），
# 用一句中性的话交代清楚，别让只想进群的人以为下面那些门槛跟自己有关。
joinLead: 想找人聊两句，就进社群；想一起做点事，就进工作团队。

# 社区群。首页和"加入我们"页都从这里渲染，顺序就是页面上的顺序
groups:
  - platform: qq # qq / qqchannel / discord / telegram，决定卡片上显示哪个图标
    name: FuzzStar
    handle: "120371716" # QQ 群号，填了会做成"点击复制"
    url: https://qm.qq.com/q/bbhpq1IXu
    note: 国内首选添加，人员多
  - platform: qqchannel
    name: 星绒社区Official
    handle: "pd10171931" # 频道号，填了会做成"点击复制"
    url: https://pd.qq.com/s/guxzvqx9i
    note: 官方 QQ 频道，可发帖
  - platform: discord
    name: FuzzStar
    handle: "" # Discord 没有群号就留空，复制按钮会自动隐藏
    url: https://discord.gg/GAAKPFD9K
    note: 习惯使用 Discord 可添加

# 招募说明与通用要求，显示在"加入我们"页工作团队板块的岗位上方
recruitNote: |-
  本次开放开发部、社区部两个方向，不要求全职，也不要求相关经验。

  两个方向均需满足：

  - 年龄 15 岁以上
  - 具备团队协作与沟通能力
  - 能够使用飞书、WPS 等协作工具
  - 能够准确理解他人的表述
  - 愿意持续学习新技能

# 招人的岗位，"加入我们"页的团队部分按这个列表渲染。两级：部门 → 下挂部门。
# 加部门就复制一段改；加下挂部门就复制一份 groups 里的那段。
# 每个部门、每个下挂部门都有 duty（负责什么）和 requirement（有什么要求），留空则不显示那一栏。
# slots 留空则不显示人数徽章；note 是标题旁边那句小字说明，纯文本。
roles:
  - title: 开发部
    slots: 招 4 人
    note: ""
    duty: |-
      负责社区 APP 的研发，以及官方网站的日常维护与迭代。
    requirement: |-
      - 前端、后端方向择一即可
      - 不排斥借助 AI 辅助编码，但提交的代码须本人能够读懂
      - 须持有 GitHub 账户，并熟练使用 Git 命令行
      - 部分项目代码暂不公开，入组后须遵守团队保密约定
    groups:
      - title: 后端开发
        slots: ""
        note: ""
        duty: |-
          负责服务端的接口设计、业务实现，以及部署与日常维护。
        requirement: |-
          - 掌握任意一门后端语言
          - 掌握任意一种数据库的使用
          - 了解服务器部署、日志、监控与基本安全常识
          - 能够独立设计业务逻辑与接口
          - 能够撰写清晰的开发文档

      - title: 前端开发
        slots: ""
        note: ""
        duty: |-
          负责页面实现、组件拆分与接口联调。
        requirement: |-
          - 掌握任意一门前端框架，熟悉相关技术栈
          - 能够独立完成页面开发、组件拆分、状态管理与接口联调
          - 了解前端工程化
          - 能够独立排查常见问题

  - title: 社区部
    slots: 招 15 人
    note: ""
    duty: |-
      负责社区部的整体事务与线下聚会的筹备，具体分工见下挂部门。
    requirement: |-
      须了解圈内文化与基本礼仪。
    groups:
      - title: 宣传部
        slots: 招 3 人
        note: ""
        duty: |-
          负责对外宣传，包括活动与公告的图文、视频制作，以及各平台内容的发布与维护。
        requirement: |-
          - 具备图文设计或视频剪辑能力，至少擅长其中一项
          - 撰写的文案表述准确，无需他人返工
          - 有海报、封面等物料版式经验者优先

      - title: 社区运营
        slots: 招 2 人
        note: ""
        duty: |-
          负责整个社区的运营工作，统筹社区部工作。
        requirement: |-
          - 具备带团队推进事务的经验
          - 事务集中时能够分清轻重缓急
          - 至少熟悉 QQ 群、QQ 频道、Discord 中的一个平台

      - title: 社群运营
        slots: 招 5 人
        note: ""
        duty: |-
          负责社群（Discord、QQ）的日常运营，由社区运营统筹。
        requirement: |-
          - 活跃于 QQ 群、QQ 频道或 Discord，熟悉平台规则与氛围
          - 处理刷屏、争执等情况时能够把握分寸，情绪稳定
          - 能够接受轮班，保证日常有人值守

      - title: 方块运营
        slots: 招 5 人
        note: Minecraft 社区服运营组
        duty: |-
          负责暖绒星港的日常运营，包括版本更新、开荒活动与玩家答疑。
        requirement: |-
          - 有 Minecraft 游玩经验，了解 Java 版联机方式
          - 面对新玩家的重复提问有耐心

# 首页那条"友链与合作"横幅上的一句话摘要，纯文本。
# 完整说明在下面的 collaboration 里，太长，塞不进横幅。
collaborationLead: 友链互换、活动联办、内容互推，都欢迎来谈。

# "友链与合作"页底部的合作说明，按 markdown 写
collaboration: |-
  星绒社区欢迎兽圈里的组织、社团、展会、创作者站点来谈合作，目前主要做三类事。

  **友链互换**：内容正常、能长期维护的兽圈相关站点都可以换。把名称、网址、一句话简介和图标发到下面的邮箱，我们看过一遍再挂上去。

  **活动联办**：线下聚会、线上活动都能聊，但得先把各方负责什么、费用怎么分、遇到突发情况谁来处理讲清楚，谈拢了再对外公布。

  **内容互推**：帮忙转个公告、留个友链位这类，形式灵活，具体再谈。

  合作不用签什么，觉得合适就一起做；哪天不合适了，两边说一声停下就行。
