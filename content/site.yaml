# 站点全局信息。
# 页面上的域名、邮箱、群链接、岗位全部从这份文件读，改完这里全站跟着变。
# 引号里是空的就代表还没填：页面要么整块不显示，要么显示一句友好的空状态，
# 不会替你编内容，也不会把文件路径这类内部信息露给访客。
#
# recruitNote、roles[].duty、roles[].requirement、collaboration 这几个字段按 markdown 写，
# 能用小标题（#### 标题）、列表（- 一项）、加粗（**字**），构建时渲染成页面排版。
# 其余字段是纯文本，写什么显示什么。

# 组织本体
org:
  name: FuzzStar # 英文名，用在字标和搜索引擎标题里
  nameZh: 星绒社区 # 中文名
  badge: 非官方兽圈社区 # 首页标题上方那个小标签，留空就不显示
  tagline: 把散在各处的同好，聚到一处。
  intro: 星绒社区（FuzzStar）是一个非官方的福瑞同好组织。现在主要聚在 QQ 群、QQ 频道和 Discord；线下聚会与社区 APP 都在筹备中。

# 站点地址与对外联系方式
url: https://fuzstar.org
email: max@fuzstar.org # 对外联系邮箱

# ICP 备案号，拿到之后填这里，填了页脚才会显示备案信息
icp: ""
icpUrl: https://beian.miit.gov.cn

# "加入我们"页开头那句。这页底下有两条路（进社群、进工作团队），
# 用一句中性的话交代清楚，别让只想进群的人以为下面那些门槛跟自己有关。
joinLead: 想找人聊两句，就进社群；想一起做点事，就进工作团队。

# 社区群。首页和"加入我们"页都从这里渲染，顺序就是页面上的顺序
groups:
  - platform: qq # qq / qqchannel / discord / telegram，决定卡片上显示哪个图标
    name: FuzzStar
    handle: "120371716" # QQ 群号，填了会做成"点击复制"
    url: https://qm.qq.com/q/bbhpq1IXu
    note: 国内首选添加，人员多
  - platform: qqchannel
    name: 星绒社区Official
    handle: "pd10171931" # 频道号，填了会做成"点击复制"
    url: https://pd.qq.com/s/guxzvqx9i
    note: 官方 QQ 频道，可发帖
  - platform: discord
    name: FuzzStar
    handle: "" # Discord 没有群号就留空，复制按钮会自动隐藏
    url: https://discord.gg/GAAKPFD9K
    note: 习惯使用 Discord 可添加

# 招募说明与通用要求，显示在"加入我们"页工作团队板块的岗位上方
recruitNote: |-
  这次开放开发部、社区部两个方向，不要求全职，也不要求相关经验。

  两个方向都要满足：

  - 年龄：15+
  - 具备团队协作能力及沟通能力
  - 会使用飞书、WPS 这类协作工具
  - 能听懂别人在说什么
  - 愿意持续学习新技能

# 招人的岗位，"加入我们"页的团队部分按这个列表渲染。
# 加岗位就复制一段改；slots 留空则不显示右上角的人数徽章。
roles:
  - title: 开发部
    slots: "" # 招几个人，留空就不显示徽章
    duty: |-
      社区 APP 的开发，以及官网的日常维护和迭代。
    requirement: |-
      #### 后端方向

      - 至少懂得任意一门后端语言
      - 任意一种数据库的使用
      - 服务器部署、日志、监控、基本安全常识
      - 能设计业务逻辑及接口
      - 能写清晰的开发文档

      #### 前端方向

      - 至少懂得任意一门前端框架，熟悉前端技术栈
      - 可独立完成页面开发、组件拆分、状态管理、接口联调
      - 了解前端工程化
      - 能够解决常见的问题

      前后端会一侧即可。

      不排斥用 AI 辅助写代码，但提交上去的代码你得看得懂。

      必须持有一个 GitHub 账户，并熟练使用 Git CLI。

      部分项目代码暂不公开，进组后需遵守团队的保密约定。

  - title: 社区部
    slots: ""
    duty: |-
      QQ 群、QQ 频道和 Discord 的日常管理，公告发布，以及线下聚会的筹备。
    requirement: |-
      必须懂得圈内文化及礼仪。

      成员暂不进行分组，故暂不提出过多要求。

# 首页那条"友链与合作"横幅上的一句话摘要，纯文本。
# 完整说明在下面的 collaboration 里，太长，塞不进横幅。
collaborationLead: 友链互换、活动联办、内容互推，都欢迎来谈。

# "友链与合作"页底部的合作说明，按 markdown 写
collaboration: |-
  星绒社区欢迎兽圈里的组织、社团、展会、创作者站点来谈合作，目前主要做三类事。

  **友链互换**：内容正常、能长期维护的兽圈相关站点都可以换。把名称、网址、一句话简介和图标发到下面的邮箱，我们看过一遍再挂上去。

  **活动联办**：线下聚会、线上活动都能聊，但得先把各方负责什么、费用怎么分、遇到突发情况谁来处理讲清楚，谈拢了再对外公布。

  **内容互推**：帮忙转个公告、留个友链位这类，形式灵活，具体再谈。

  合作不用签什么，觉得合适就一起做；哪天不合适了，两边说一声停下就行。
