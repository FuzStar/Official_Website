# 暖绒星港，组织的 Minecraft 服务器。
# 页面内容全从这里读，改完重新构建即可。
#
# about、rules、penalty、access[].body 这几个字段按 markdown 写，构建期渲染成页面排版，
# 能用有序列表（1. ）、无序列表（- ）、表格（| 列 | 列 |）、加粗（**字**）、小标题（#### 标题）。
# 其余字段是纯文本，写什么显示什么。
#
# 引号里是空的就代表还没填：页面要么整块不显示，要么显示一句友好的空状态。

name: 暖绒星港
lead: 星绒社区自己的生存服，机器开着就一直能进，谁都能来。

# 要展示实时在线状态的地址。留空则整块不显示。
# 填玩家实际要连的那个域名，两个查询服务都会自己解析 SRV，所以不要带端口，
# 也别填 IP——SRV 是挂在域名上的。下面 addresses 里的 Java 地址改了，这里跟着改。
status:
  java: play.fuzstar.net

# 连接方式，一张卡片一条。platform 决定图标，目前支持 java / bedrock，写别的会没有图标。
# port 留空表示走 SRV，玩家不用填端口。
addresses:
  - platform: java
    label: Java 版
    host: play.fuzstar.net
    port: ""
    note: 地址填这个就行，端口不用管。
  - platform: bedrock
    label: 基岩版
    host: play.fuzstar.net
    port: "36199"
    note: 端口要手动填。目前只对国内网络开放。

# "怎么进"的几条路径。body 按 markdown 写，
# 想加一条就复制一段改。
access:
  - title: 正版账号
    body: 用微软账号登录，直接就能进。
  - title: 皮肤站账号
    body: |-
      在 HMCL、PCL 这类启动器里配好外置登录，直接进，还能用上自己的皮肤。

      认证服务器地址填 `https://littleskin.cn/api/yggdrasil`。支持 ALI 的启动器直接填 `littleskin.cn` 也能认出来。
  - title: 基岩版
    body: 用上面的地址和端口进来就行，和 Java 版进的是同一个世界。
  - title: 离线账号
    body: |-
      没有正版、也没有皮肤站账号，一样能进，但要先注册一个名字。

      进服后在聊天框输入：

      ```
      /register 密码 密码
      ```

      之后每次进来用 `/login 密码`。名字被占了就换一个。
      离线账号的名字谁先注册算谁的，别冒用别人的 ID。

# 服务器在玩什么。想补地图特色、装了哪些插件、办过什么活动，往这段后面加。
about: |-
  一台长期开着的生存服，想盖房子、想种地、想找块地方挂着，都行。

  双端互通，Java 和基岩版进的是同一个世界。

# 服务器规矩。有序列表会渲染成带编号的样式。
rules: |-
  1. **别动别人的东西** —— 建筑、箱子、动物都归主人，想用先用聊天问一声。
  2. **别用外挂** —— 飞行、透视、自动挖矿、改客户端都算，用了直接封。
  3. **别拿漏洞刷东西** —— 发现了先说一声，自己拿去刷的，刷出来的一并清掉。
  4. **别把服务器搞卡** —— 大批刷实体、堆机器把 TPS 压下去，影响的是所有人，故意的按最重处理。
  5. **建东西别挡路** —— 公共通道和别人家门口留出来。
  6. **聊天别刷屏** —— 广告、拉人、发外链都不行。
  7. **尊重别人的兽设** —— 不擅自拿去用、拿去改。
  8. **有矛盾找管理** —— 公屏对骂解决不了问题，两边都难看。

# 处罚对照表。改天数、加条目都在这张表里动。
# 具体天数目前是拟的，等管理组定下来再改成实际执行的标准。
penalty: |-
  | 情况 | 处理 |
  | --- | --- |
  | 刷屏、发广告、挡路、公屏对骂 | 管理先提醒；不听则禁言 1–7 天 |
  | 辱骂、骚扰，或擅自动用他人兽设 | 视情节禁言至封禁 |
  | 偷东西、拆别人建筑 | 回档修补、物品归还失主，并封禁 3–30 天 |
  | 使用外挂、改客户端 | 直接封禁，不接受申诉 |
  | 利用漏洞刷取物品 | 清掉所得后封禁 |
  | 故意卡服、崩服 | 永久封禁 |

# 页面底部引导进群那句话，纯文本。
joinNote: 一个人玩没意思的话，进群喊一声，多半有人在。
