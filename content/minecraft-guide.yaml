# 游戏服教程页（/minecraft/guide）。整块（section）留空就等于关掉它，
# 页面上不会留空白区，所以没想好的块先空着，想好了再填。
#
# id 是页面锚点，别的页面能直接用 /minecraft/guide#residence 跳过来，起好之后别再改。
# lead 是这一块开头那句话，纯文本。
# groups 用来把指令分组，可以省掉，省掉就直接铺条目。
# entries 一条一个指令：
#   cmd  指令原文，页面上等宽显示并带一个复制按钮，留着空就是一条没有指令的提示
#   desc 说明文字，支持行内 markdown（**加粗**、`代码`）。这里是行内渲染，
#        写列表或标题会原样显示出来，别写。
# note 是这一块末尾的补充，按 markdown 整段渲染，能写列表、能分行。

lead: 服务器装的东西不少，指令不用背——照着下面敲就行，每条都能点一下直接复制。

sections:
  - id: residence
    title: 领地与财产保护
    lead: 自己盖的东西圈起来才有保护。没圈的地方，别人能动手。
    groups:
      - title: 圈一块自己的地
        entries:
          - cmd: /res create 名字
            desc: 拿木锄左键点一个角、右键点对角，圈出范围后敲这条，这块地就归你了。
          - cmd: /res tp 名字
            desc: 不管人在哪，直接传回自己的领地。
          - cmd: /res remove 名字
            desc: 撤掉保护。地里的东西不会没，只是别人又能动了。
      - title: 让朋友能进来
        entries:
          - cmd: /res pset 领地名 玩家名 move true
            desc: 让他能进出，但什么都不能改。
          - cmd: /res pset 领地名 玩家名 container true
            desc: 让他能开箱子、按门、按按钮。
          - cmd: /res pset 领地名 玩家名 build true
            desc: 让他能盖也能拆。想清楚再给。
          - cmd: /res pset 领地名 玩家名 remove
            desc: 收回上面给的全部权限。
      - title: 东西被人动了
        entries:
          - cmd: /co i
            desc: 打开检查模式，之后对着方块点一下，就能看到它最近被谁动过。再敲一次关掉。
          - cmd: /co l 玩家名
            desc: 查某个人最近都动过什么。
    note: |-
      领地指令还有一大堆，`/res help` 能列出全部。想要某个效果又不知道敲哪条，在群里问一声。
      查记录那两条要求权限，敲了提示没权限的话，找管理开。

  - id: teleport
    title: 传送与快捷菜单
    lead: 走远路不用腿着去，家、出生点、别人身边都能直接传。
    groups:
      - title: 家和出生点
        entries:
          - cmd: /sethome 名字
            desc: 把脚下这个位置存成家。名字自己起，不写就用默认那个。
          - cmd: /home 名字
            desc: 传送回家。
          - cmd: /delhome 名字
            desc: 删掉不想要的家。
          - cmd: /spawn
            desc: 回出生点。
      - title: 去别的地方
        entries:
          - cmd: /tpa 玩家名
            desc: 请求传到对方身边，他同意了才过得去。
          - cmd: /tpaccept
            desc: 同意别人的传送请求。
          - cmd: /warp
            desc: 看服务器设了哪些公共地点，选一个过去。
          - cmd: /back
            desc: 回到上一次死掉、或者传送之前的位置。
      - title: 记不住就敲菜单
        entries:
          - cmd: /menu
            desc: 弹出功能菜单，上面这些大多能在里面点到，不用记指令。

  - id: chat
    title: 聊天与个性
    lead: 聊天不只是打字——能分频道、给自己的话上色，还能攒声誉。
    groups:
      - title: 私聊
        entries:
          - cmd: /msg 玩家名 内容
            desc: 单独跟某个人说。也可以简写成 /m 或者 /w。
          - cmd: /r 内容
            desc: 回复上一条私聊，不用再打一遍名字。
          - cmd: /ignore 玩家名
            desc: 不想收某人的私聊就屏蔽掉。想解除就敲 /unignore 玩家名。
      - title: 换频道说话
        entries:
          - cmd: /channel list
            desc: 看服务器开了哪些频道。
          - cmd: /channel join 频道名
            desc: 加入一个频道，之后就能一直在里面说话。
      - title: 给自己弄点花样
        entries:
          - cmd: /color
            desc: 打开颜色菜单，换聊天字色，也能换自己名字的颜色。
          - cmd: /tags
            desc: 挑一个挂在名字前面的标签，★、❤、🌙 这些。
          - cmd: /rep 玩家名
            desc: 给别人点个赞。同一个人 24 小时只能点一次。
          - cmd: /rep top
            desc: 看谁的声誉最高。
    note: |-
      聊天开头加个符号就能换频道，不用记指令：
      - `!` 全局，所有人都看得到。这是默认频道，不加前缀也是发在这儿
      - `.` 本地，只有 100 格以内的玩家看得到
      - `$` 交易，用来喊买卖
      - `?` 求助，有问题在这儿问

  - id: economy
    title: 经济
    lead: 服务器里的钱叫「小鱼干」，能互相转账，也能拿去换聊天装饰。
    groups:
      - title: 余额与转账
        entries:
          - cmd: /money
            desc: 看自己有多少小鱼干。
          - cmd: /money 玩家名
            desc: 看别人有多少小鱼干。
          - cmd: /pay 玩家名 数量
            desc: 把小鱼干转给对方。
    note: |-
      小鱼干主要从这几处来：**聊天成就**解锁（越难给的越多）、**聊天小游戏**答对、
      以及签到和在线奖励里附带的那一点——日常够用，想攒大的得靠成就。

      商店里能买到聊天颜色、聊天标签、名字颜色这些东西，价格从一百到一千小鱼干不等。

  - id: rewards
    title: 在线奖励与时长
    lead: 上线就有东西拿——签到、挂时长、每周礼包都收在同一个菜单里。
    groups:
      - title: 打开菜单
        entries:
          - cmd: /rewards
            desc: 奖励全在这里面，点一下就领。每天上线先敲这一下。
          - cmd: /playtime
            desc: 看自己累计在线多久，离下一档奖励还差多少。
    note: |-
      菜单里装着这些：
      - **每日签到** —— 隔 20 小时能领一次，连着签还有额外的梯度奖励
      - **在线时长奖励** —— 分 1 小时、5 小时、20 小时、60 小时四档，一档领一次
      - **每周礼包** —— 每周一 18:00 重置，有几率开出稀有物品
      - **新手礼包** —— 只能领一次，给你起步用的物资
      - **投票奖励**、**邀请好友** —— 攒够就能领
