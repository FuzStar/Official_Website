# "关于我们"页的内容。
# lead 和 sections[].body 按 markdown 写，能用列表（- 一项）、加粗（**字**）、小标题（#### 标题）。
# 加一块就复制一段 sections 改；哪块暂时不想放就整段删掉，页面跟着少一块。

# 页头标题下面那句导语
lead: 一个非官方的福瑞同好组织，把散在各处的同好聚到一处。

sections:
  - title: 我们是谁
    body: |-
      星绒社区（FuzzStar）是一个非官方的福瑞同好组织。我们没有实体场地，也不挂靠任何机构，靠的是成员自己出力把事做起来。

  - title: 我们在做什么
    body: |-
      日常都在 QQ 群、QQ 频道和 Discord 里：聊天、发帖、约着一起玩。

      线下聚会和社区 APP 都还在筹备中，有了进展会在公告里说。

  - title: 想做成什么样
    body: |-
      圈里的同好散在各个平台，热闹归热闹，但很难在同一个地方长期待下去。

      我们想做的就是把散在各处的同好聚到一处：平时有地方聊天，想做事的时候有人一起。

  - title: 怎么找到我们
    body: |-
      想聊天，进社群；想一起做事，看「加入我们」；想谈合作，看「友链与合作」。三个平台的地址和联系邮箱都在那两个页面里。
